<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Missão | Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .detail-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Cabeçalho da missão */
        .mission-header {
            background-color: #2c3e50;
            color: white;
            padding: 25px 30px;
        }

        .mission-header h2 {
            margin: 0 0 6px;
            font-weight: 400;
            font-size: 1.4rem;
        }

        .mission-header p {
            margin: 0;
            opacity: 0.7;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Tabela de detalhes */
        .info-table {
            width: 100%;
            border-collapse: collapse;
        }

        .info-table td {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .info-table .label {
            font-weight: 600;
            color: #7f8c8d;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 140px;
        }

        /* Tags de ninjas */
        .ninja-tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin: 2px;
            border: 1px solid #b3e5fc;
        }

        .ninja-tag small {
            opacity: 0.8;
        }

        /* Badge de Rank */
        .rank-badge {
            background: #ecf0f1;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #7f8c8d;
            margin-left: 4px;
        }

        .no-ninja {
            color: #bdc3c7;
            font-style: italic;
            font-size: 0.85rem;
        }

        /* Botões Estilizados */
        .actions {
            padding: 18px 20px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin: 2px;
            transition: all 0.3s ease;
        }

        .btn-edit      { background-color: #f1c40f; color: white; }
        .btn-delete    { background-color: #e74c3c; color: white; }
        .btn-secondary { background-color: #7f8c8d; color: white; }

        .btn:hover {
            opacity: 0.8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<h1>Detalhes da Missão</h1>

<div class="detail-container">

    <div class="mission-header">
        <h2 th:text="${missao.titulo}"></h2>
        <p th:text="${missao.descricao}"></p>
    </div>

    <table class="info-table">
        <tr>
            <td class="label">ID</td>
            <td th:text="${missao.id}" style="font-family: monospace; color: #7f8c8d;"></td>
        </tr>
        <tr>
            <td class="label">Equipe</td>
            <td>
                <div th:if="${missao.ninja != null and not #lists.isEmpty(missao.ninja)}">
                    <span th:each="ninja : ${missao.ninja}" class="ninja-tag">
                        <span th:text="${ninja.nome}"></span>
                        <span class="rank-badge" th:text="${ninja.rank}"></span>
                    </span>
                </div>
                <span th:if="${missao.ninja == null or #lists.isEmpty(missao.ninja)}" class="no-ninja">
                    Nenhum ninja atribuído
                </span>
            </td>
        </tr>
    </table>

    <div class="actions">
        <a th:href="@{/missoes/ui/listar}" class="btn btn-secondary">Voltar</a>
        <a th:href="@{/missoes/ui/alterar/{id}(id=${missao.id})}" class="btn btn-edit">Alterar</a>
        <a th:href="@{/missoes/ui/deletar/{id}(id=${missao.id})}" class="btn btn-delete">Deletar</a>
    </div>

</div>

</body>
</html>
