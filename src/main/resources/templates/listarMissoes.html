<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Missões | Dashboard</title>
    <style>
        /* Estilização Geral */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Container da Tabela */
        .table-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        /* Cabeçalho */
        thead {
            background-color: #2c3e50;
            color: #ffffff;
        }

        th {
            padding: 15px 20px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Linhas e Células */
        td {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tbody tr:hover {
            background-color: #f9f9f9;
            transition: background 0.3s ease;
        }

        /* Título da Missão */
        .mission-title {
            font-weight: bold;
            color: #2c3e50;
        }

        /* Tags de ninja na missão */
        .ninja-tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin: 2px;
            border: 1px solid #b3e5fc;
        }

        .no-ninja {
            color: #bdc3c7;
            font-style: italic;
            font-size: 0.85rem;
        }

        /* Botões Estilizados */
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin: 2px;
            transition: all 0.3s ease;
        }

        .btn-view   { background-color: #3498db; color: white; }
        .btn-edit   { background-color: #f1c40f; color: white; }
        .btn-delete { background-color: #e74c3c; color: white; }
        .btn-success { background-color: #2ecc71; color: white; }

        .btn:hover {
            opacity: 0.8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Toolbar */
        .toolbar {
            max-width: 1200px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: flex-end;
        }

        /* Mensagem de feedback */
        .mensagem {
            max-width: 1200px;
            margin: 0 auto 16px;
            padding: 12px 20px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<h1>Lista de Missões</h1>

<div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>

<div class="toolbar">
    <a th:href="@{/missoes/ui/adicionar}" class="btn btn-success">+ Adicionar Missão</a>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Missão</th>
            <th>Descrição</th>
            <th>Equipe Responsável</th>
            <th style="text-align: center;">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="missao : ${missoes}">

            <td th:text="${missao.id}" style="font-family: monospace; color: #7f8c8d;"></td>

            <td>
                <span class="mission-title" th:text="${missao.titulo}"></span>
            </td>

            <td th:text="${missao.descricao}" style="max-width: 300px; color: #666; font-size: 0.9rem;"></td>

            <td>
                <div th:if="${not #lists.isEmpty(missao.ninja)}">
                    <span th:each="ninja : ${missao.ninja}" class="ninja-tag">
                        <span th:text="${ninja.nome}"></span>
                        <small th:text="' (' + ${ninja.rank} + ')'"></small>
                    </span>
                </div>
                <span th:if="${#lists.isEmpty(missao.ninja)}" class="no-ninja">Nenhum ninja atribuído</span>
            </td>

            <td style="text-align: center; white-space: nowrap;">
                <a th:href="@{/missoes/ui/listar/{id}(id=${missao.id})}" class="btn btn-view">Detalhes</a>
                <a th:href="@{/missoes/ui/alterar/{id}(id=${missao.id})}" class="btn btn-edit">Alterar</a>
                <a th:href="@{/missoes/ui/deletar/{id}(id=${missao.id})}" class="btn btn-delete">Deletar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
