<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Ninjas | Dashboard</title>
    <style>
        /* Estilização Geral */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Container da Tabela */
        .table-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden; /* Garante que o border-radius funcione */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        /* Cabeçalho */
        thead {
            background-color: #2c3e50;
            color: #ffffff;
        }

        th {
            padding: 15px 20px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Linhas e Células */
        td {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tbody tr:hover {
            background-color: #f9f9f9;
            transition: background 0.3s ease;
        }

        /* Avatar do Ninja */
        .ninja-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ddd;
        }

        /* Botões Estilizados */
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin: 2px;
            transition: all 0.3s ease;
        }

        .btn-view { background-color: #3498db; color: white; }
        .btn-edit { background-color: #f1c40f; color: white; }
        .btn-delete { background-color: #e74c3c; color: white; }

        .btn:hover {
            opacity: 0.8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Badges de Rank */
        .rank-badge {
            background: #ecf0f1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Toolbar */
        .toolbar {
            max-width: 1200px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-success { background-color: #2ecc71; color: white; }

        /* Mensagem de feedback */
        .mensagem {
            max-width: 1200px;
            margin: 0 auto 16px;
            padding: 12px 20px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<h1>Lista de Ninjas</h1>

<div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>

<div class="toolbar">
    <a th:href="@{/ninjas/ui/adicionar}" class="btn btn-success">+ Adicionar Ninja</a>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Ninja</th>
            <th>Informações</th>
            <th>Rank</th>
            <th>Missão Atual</th>
            <th style="text-align: center;">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ninja : ${ninjas}">

            <td th:text="${ninja.id}"></td>

            <td>
                <img th:src="${ninja.imgUrl}" alt="Avatar" class="ninja-img"/>
            </td>

            <td>
                <strong th:text="${ninja.nome}"></strong><br>
                <small th:text="${ninja.email}" style="color: #777;"></small><br>
                <small th:text="${ninja.idade} + ' anos'"></small>
            </td>

            <td>
                <span class="rank-badge" th:text="${ninja.rank}"></span>
            </td>

            <td>
                <div th:if="${ninja.missoes}">
                    <span th:text="${ninja.missoes.descricao}"></span><br>
                    <em style="font-size: 0.8rem; color: #95a5a6;">Nível: <span th:text="${ninja.missoes.titulo}"></span></em>
                </div>
                <span th:if="${ninja.missoes == null}" style="color: #bdc3c7; font-style: italic;">Disponível</span>
            </td>

            <td style="text-align: center; white-space: nowrap;">
                <a th:href="@{/ninjas/ui/listar/{id}(id=${ninja.id})}" class="btn btn-view">Detalhes</a>
                <a th:href="@{/ninjas/ui/alterar/{id}(id=${ninja.id})}" class="btn btn-edit">Alterar</a>
                <a th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}" class="btn btn-delete">Deletar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
